services:
  backend:
    image: python:3.11-slim
    volumes:
      - ./backend:/app
    working_dir: /app
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install -r requirements.txt && 
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    image: node:20-slim
    volumes:
      - ./frontend:/app
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      - WATCHPACK_POLLING=true
    # This runs npm install inside the container so you don't have to
    command: >
      sh -c "npm install && npm run dev -- --host"